<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เว็บไซต์ของฉัน</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

<!-- Google Fonts: Noto Sans Thai -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script>
const ME = {

  // GitHub username ของคุณ ใช้ดึงรูปโปรไฟล์มาแสดงอัตโนมัติ ไม่ต้องอัปโหลดรูปเอง
  github: "tanboonla007",

  // ชื่อที่ต้องการให้แสดง ใช้ชื่อเล่นได้
  name: "Tan Tanboon",

  // บอกว่าคุณคือใคร สั้น ๆ
  role: "นักศึกษาวิศวกรรมคอมพิวเตอร์ ปี 2 · มทร.อีสาน",

  // หนึ่งประโยคว่าคุณสนใจสร้างอะไร เขียนให้เจาะจง อย่าเขียนกว้าง ๆ
  tagline: "สร้าง UI ด้วย State Management และเชื่อมต่อ RESTful API อย่างเป็นระบบ <3",

  // แนะนำตัว 2-3 บรรทัด ว่ามาจากไหน สนใจอะไร กำลังจะไปทางไหน
  about: "กำลังสนุกกับการเรียนรู้และสร้างสรรค์ Web Application ด้วยเทคโนโลยีสมัยใหม่ เน้นการเขียนโค้ดที่สะอาด อ่านง่าย และสร้างประสบการณ์การใช้งานที่ดีเยี่ยม เปิดรับโอกาสใหม่ๆ ในการทำโปรเจกต์และร่วมงานเสมอ 💻⚡️",

  // กำลังเรียนรู้อะไรอยู่ตอนนี้ ใส่ได้ 2-5 รายการ
  learning: [
    "พื้นฐานอินเทอร์เน็ตและบริการออนไลน์",
    "Frontend & Backend Development",
    "การพัฒนา Web Application",
  ],

  // ผลงาน
  works: [],

  // ช่องทางติดต่อ
  links: [
    { label: "GitHub", url: "https://github.com/tanboonla007" },
  ],

  // ธีมสี เลือกหนึ่งอย่าง: "ocean" | "sunset" | "forest" | "grape" | "mono" | "mono-light"
  theme: "mono-light",

};
</script>

<style>
/* ---------- Smooth Scroll ---------- */
html {
  scroll-behavior: smooth;
}

/* ---------- สีพื้นฐาน ทุกธีมใช้ร่วมกัน ---------- */
:root {
  --bg:#0b1020; --line:#24304f; --text:#e8edf7; --muted:#93a1c0;
  --surface:rgba(255,255,255,.05);      /* พื้นของการ์ดผลงานและแผงข้อมูล */
  --nav-bg:rgba(11, 16, 32, 0.85);      /* พื้นหลัง Navbar แบบโปร่งแสง */
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

/* ---------- ธีมสี ---------- */
:root,
[data-theme="ocean"]  { --accent:#38bdf8; --accent-soft:#0ea5e9; --glow1:#1d2a52; --glow2:#10305c; --nav-bg:rgba(11, 16, 32, 0.85); }
[data-theme="sunset"] { --accent:#fb923c; --accent-soft:#f97316; --glow1:#4a2418; --glow2:#5c2b10; --nav-bg:rgba(15, 12, 10, 0.85); }
[data-theme="forest"] { --accent:#34d399; --accent-soft:#10b981; --glow1:#14342a; --glow2:#0f3d2e; --nav-bg:rgba(10, 20, 16, 0.85); }
[data-theme="grape"]  { --accent:#c084fc; --accent-soft:#a855f7; --glow1:#2e1d52; --glow2:#3d1a5c; --nav-bg:rgba(20, 12, 32, 0.85); }
[data-theme="mono"]   { --accent:#e2e8f0; --accent-soft:#cbd5e1; --glow1:#1e293b; --glow2:#0f172a; --nav-bg:rgba(15, 23, 42, 0.85); }

[data-theme="mono-light"] {
  --accent:#334155; --accent-soft:#475569; --glow1:#dbe3ee; --glow2:#e6ebf3;
  --bg:linear-gradient(180deg, #ffffff 0%, #edf7fa 60%, #bcedf7 100%); --line:#ccd6e4; --text:#0f172a; --muted:#52627d;
  --surface:rgba(15,23,42,.04);
  --nav-bg:rgba(255, 255, 255, 0.85);
}

*{ box-sizing:border-box }

body{
  margin:0; min-height:100vh; color:var(--text);
  font-family: 'Noto Sans Thai', 'Noto Sans', system-ui, -apple-system, sans-serif;
  line-height:1.75;
  background:
    radial-gradient(1000px 460px at 12% -10%, var(--glow1) 0, transparent 60%),
    radial-gradient(820px 400px at 92% 0,   var(--glow2) 0, transparent 55%),
    var(--bg);
}

/* ---------- Navbar ---------- */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  
  /* Animation: Fade In ลงมาจากด้านบน */
  animation: navSlideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes navSlideDown {
  from {
    transform: translateY(-100%);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.nav-container {
  max-width: 760px;
  margin: 0 auto;
  padding: 12px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Brand (โลโก้/ชื่อ) */
.nav-brand {
  font-weight: 700;
  color: var(--text);
  text-decoration: none;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.nav-brand:hover {
  transform: scale(1.04);
  opacity: 0.9;
}

.nav-links {
  display: flex;
  gap: 20px;
  list-style: none;
  margin: 0;
  padding: 0;
}

/* ลิงก์เมนู + เส้นใต้วิ่ง (Animated Underline) */
.nav-links a {
  position: relative;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 4px 0;
  transition: color 0.25s ease;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background-color: var(--accent);
  border-radius: 2px;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav-links a:hover {
  color: var(--text);
}

.nav-links a:hover::after {
  transform: scaleX(1);
  transform-origin: left;
}

/* ความกว้างจำกัดไว้ ไม่ให้บรรทัดยาวจนตาไล่ไม่ทัน */
.wrap{ max-width:760px; margin:0 auto; padding:0 22px 80px }

/* ---------- ส่วนหัว ---------- */
.hero{ display:flex; gap:22px; align-items:center; padding:48px 0 8px; flex-wrap:wrap }
.avatar{
  width:96px; height:96px; border-radius:50%;
  border:2px solid var(--accent); object-fit:cover; flex-shrink:0;
  background:var(--surface);
  transition: transform 0.3s ease;
}
.avatar:hover {
  transform: scale(1.05) rotate(3deg);
}
.avatar-fallback{
  width:96px; height:96px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--accent); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-size:38px; font-weight:600; color:var(--accent);
}
.hero-text{ flex:1; min-width:240px }
.role{
  font:600 12px/1 var(--mono); letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin:0 0 8px;
}
h1{ font-size:clamp(30px,6vw,46px); line-height:1.15; margin:0 0 8px; letter-spacing:-.02em }
.tagline{ font-size:clamp(17px,2.6vw,20px); color:var(--text); margin:0; opacity:.92 }

.about{ color:var(--muted); margin:26px 0 0; max-width:62ch }

/* ---------- ปุ่มลิงก์ ---------- */
.links{ display:flex; flex-wrap:wrap; gap:10px; padding:0; margin:24px 0 0; list-style:none }
.links a{
  display:inline-block; border:1px solid var(--line); border-radius:999px;
  padding:9px 20px; color:var(--text); text-decoration:none; font-size:15px;
  transition:all 0.25s ease;
}
.links a:hover, .links a:focus-visible{
  border-color:#3baeff; color:#3baeff;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59, 174, 255, 0.15);
}

/* ---------- หัวข้อของแต่ละส่วน ---------- */
section{ margin-top:52px; scroll-margin-top: 70px; }
h2{
  font:600 12px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); border-bottom:1px solid var(--line);
  padding-bottom:10px; margin:0 0 20px;
}

/* ---------- รายการกำลังเรียนรู้ ---------- */
.learning{ list-style:none; padding:0; margin:0 }
.learning li{
  border-left:2px solid #3BAEFF; padding:2px 0 2px 16px;
  margin-bottom:14px; color:var(--muted);
  transition: transform 0.2s ease, color 0.2s ease;
}
.learning li:hover {
  transform: translateX(6px);
  color: var(--text);
}

/* ---------- ผลงาน ---------- */
.works{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)) }
.work{
  border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  background:var(--surface);
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.work:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
}
.work h3{ margin:0 0 6px; font-size:17px }
.work p{ margin:0; color:var(--muted); font-size:14.5px }
.work a{ color:var(--accent); text-decoration:none; font-size:14px; display:inline-block; margin-top:10px }
.work a:hover{ text-decoration:underline }
.empty{
  border:1px dashed var(--line); border-radius:12px; padding:26px 20px;
  color:var(--muted); text-align:center; font-size:15px;
}

/* ---------- แผงข้อมูลการเชื่อมต่อ ---------- */
.panel{ border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:4px 20px 16px }
.row{
  display:grid; grid-template-columns:minmax(130px,1fr) minmax(0,1.5fr); gap:12px;
  padding:11px 0; border-bottom:1px dashed var(--line); align-items:baseline;
}
.row:last-of-type{ border-bottom:0 }
.row dt{ color:var(--muted); font-size:14px; margin:0 }
.row dd{ margin:0; font-family:var(--mono); font-size:14px; color:#3baeff; word-break:break-all }
.row .note{ display:block; color:var(--muted); font-family:inherit; font-size:12.5px }
.hint{ color:var(--muted); font-size:14px; margin:14px 0 0 }

footer{ margin-top:56px; padding-top:22px; border-top:1px solid var(--line); color:var(--muted); font-size:14px }
footer a{ color:var(--accent) }

/* ---------- Scroll Reveal Animations ---------- */
.animate-on-scroll {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.animate-on-scroll.is-visible {
  opacity: 1;
  transform: translateY(0);
}

/* ---------- จอมือถือ ---------- */
@media (max-width:520px){
  .nav-container { padding: 10px 16px; }
  .nav-links { gap: 12px; font-size: 13px; }
  .hero{ padding-top:32px; gap:16px }
  .avatar, .avatar-fallback{ width:72px; height:72px; font-size:28px }
  .row{ grid-template-columns:1fr; gap:2px }
}
</style>
</head>
<body>

<!-- Navbar แบบ Sticky -->
<nav class="navbar">
  <div class="nav-container">
    <a href="#" class="nav-brand" id="navBrand">Portfolio</a>
    <ul class="nav-links">
      <li><a href="#">My Portfolio</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </div>
</nav>

<div class="wrap">

  <header class="hero animate-on-scroll">
    <img class="avatar" id="avatar" alt="" width="96" height="96">
    <div class="hero-text">
      <p class="role" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>
  <p class="about animate-on-scroll" id="about"></p>
  <ul class="links animate-on-scroll" id="links"></ul>

  <section id="learning-section" class="animate-on-scroll">
    <h2>กำลังเรียนรู้</h2>
    <ul class="learning" id="learning"></ul>
  </section>

  <section id="works-section" class="animate-on-scroll">
    <h2>ผลงาน</h2>
    <div class="works" id="works"></div>
  </section>

  <section id="network-section" class="animate-on-scroll">
    <h2>ข้อมูลการเชื่อมต่อของหน้านี้</h2>
    <div class="panel">
      <dl id="netpanel"></dl>
      <p class="hint">กด F12 เลือกแท็บ Network แล้วกด Ctrl+F5 เพื่อเปรียบเทียบค่า</p>
    </div>
  </section>

  <footer>
    สร้างด้วย HTML, CSS และ JavaScript · โฮสต์บน GitHub Pages ·
    <a id="repolink" href="https://github.com">ดูซอร์สโค้ดของหน้านี้</a>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

/* ---------- 1) นำข้อมูลจากกล่อง ME มาแสดง ---------- */
document.title = ME.name;
document.documentElement.dataset.theme = ME.theme || 'ocean';

$('role').textContent    = ME.role;
$('name').textContent    = ME.name;
$('tagline').textContent = ME.tagline;
$('about').textContent   = ME.about;
$('navBrand').textContent = '⚡ ' + ME.name;

const avatar = $('avatar');
avatar.alt = 'รูปโปรไฟล์ของ ' + ME.name;
avatar.addEventListener('error', () => {
  const box = document.createElement('div');
  box.className = 'avatar-fallback';
  box.setAttribute('aria-hidden', 'true');
  box.textContent = (ME.name || '?').trim().charAt(0);
  avatar.replaceWith(box);
});
avatar.src = 'https://github.com/' + ME.github + '.png?size=192';

for (const item of ME.learning || []) {
  const li = document.createElement('li');
  li.textContent = item;
  $('learning').appendChild(li);
}

for (const link of ME.links || []) {
  const a = document.createElement('a');
  a.href = link.url;
  a.textContent = link.label;
  a.rel = 'noopener noreferrer';
  const li = document.createElement('li');
  li.appendChild(a);
  $('links').appendChild(li);
}

if (!ME.works || ME.works.length === 0) {
  const box = document.createElement('div');
  box.className = 'empty';
  box.textContent = 'ยังไม่มีผลงานในหน้านี้ กำลังเรียนรู้อยู่ แล้วจะกลับมาเพิ่มเรื่อย ๆ';
  $('works').appendChild(box);
} else {
  for (const w of ME.works) {
    const card = document.createElement('div');
    card.className = 'work';
    const h3 = document.createElement('h3');
    h3.textContent = w.title;
    const p = document.createElement('p');
    p.textContent = w.desc;
    card.append(h3, p);
    if (w.url) {
      const a = document.createElement('a');
      a.href = w.url;
      a.textContent = 'ดูผลงาน ↗';
      a.rel = 'noopener noreferrer';
      card.appendChild(a);
    }
    $('works').appendChild(card);
  }
}

$('repolink').href = 'https://github.com/' + ME.github + '/' + ME.github + '.github.io';

/* ---------- 2) แผงข้อมูลการเชื่อมต่อ อ่านค่าจริงจาก Performance API ---------- */
function ms(v) {
  if (typeof v !== 'number' || v < 0 || Number.isNaN(v)) return '—';
  return Math.round(v) + ' ms';
}

window.addEventListener('load', () => setTimeout(() => {
  const nav = performance.getEntriesByType('navigation')[0];
  const rows = [
    ['Domain name', location.hostname || '(เปิดจากไฟล์ในเครื่อง)',
     'ชื่อโดเมนต้องถูกแปลงเป็น IP address ผ่าน DNS ก่อน จึงจะติดต่อ server ได้'],
    ['Protocol', location.protocol,
     'https คือ HTTP ที่เพิ่มการเข้ารหัสและการยืนยันตัวตน server ด้วย certificate'],
  ];
  if (nav) rows.push(
    ['HTTP version', nav.nextHopProtocol || '—',
     'h2 คือ HTTP/2 และ h3 คือ HTTP/3 ซึ่งส่งหลายไฟล์พร้อมกันได้ในการเชื่อมต่อเดียว'],
    ['DNS lookup', ms(nav.domainLookupEnd - nav.domainLookupStart),
     'เวลาที่ใช้แปลงชื่อโดเมนเป็น IP address ถ้าได้ 0 ms แปลว่ามีคำตอบอยู่ใน cache แล้ว'],
    ['Connection + TLS', ms(nav.connectEnd - nav.connectStart),
     'เวลาสร้างการเชื่อมต่อ รวมขั้นตอน TLS handshake ก่อนเริ่มรับส่งข้อมูลจริง'],
    ['TTFB', ms(nav.responseStart - nav.requestStart),
     'Time To First Byte เวลาตั้งแต่ส่ง request จนได้ข้อมูลไบต์แรกกลับมา ยิ่ง server ไกลยิ่งสูง'],
  );

  for (const [label, value, note] of rows) {
    const row = document.createElement('div');
    row.className = 'row';
    const dt = document.createElement('dt');
    dt.textContent = label;
    const dd = document.createElement('dd');
    dd.textContent = value;
    const small = document.createElement('span');
    small.className = 'note';
    small.textContent = note;
    dd.appendChild(small);
    row.append(dt, dd);
    $('netpanel').appendChild(row);
  }
}, 0));

/* ---------- 3) ควบคุม Smooth Scroll เมื่อกดเมนู Navbar ---------- */
document.querySelectorAll('.nav-links a').forEach(anchor => {
  anchor.addEventListener('click', function (e) {
    e.preventDefault();
    
    const targetId = this.getAttribute('href');
    const targetElement = document.querySelector(targetId);
    
    if (targetElement) {
      const navHeight = document.querySelector('.navbar').offsetHeight;
      const elementPosition = targetElement.getBoundingClientRect().top;
      const offsetPosition = elementPosition + window.pageYOffset - navHeight - 16;

      window.scrollTo({
        top: offsetPosition,
        behavior: 'smooth'
      });
    }
  });
});

/* ---------- 4) Scroll Reveal Animation (Intersection Observer) ---------- */
const observerOptions = {
  root: null,
  rootMargin: '0px',
  threshold: 0.1
};

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('is-visible');
    }
  });
}, observerOptions);

document.querySelectorAll('.animate-on-scroll').forEach(element => {
  observer.observe(element);
});
</script>
</body>
</html>
