<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เว็บไซต์ของฉัน</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text x='50' y='68' font-size='52' font-family='monospace' fill='%2322d3ee' text-anchor='middle'>&gt;_</text></svg>">

<!-- Fonts: JetBrains Mono for code/labels, Noto Sans Thai for body -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script>
const ME = {

  // GitHub username ของคุณ ใช้ดึงรูปโปรไฟล์มาแสดงอัตโนมัติ ไม่ต้องอัปโหลดรูปเอง
  github: "tanboonla007",

  // ชื่อที่ต้องการให้แสดง ใช้ชื่อเล่นได้
  name: "Tan Tanboon",

  // บอกว่าคุณคือใคร สั้น ๆ
  role: "นักศึกษาวิศวกรรมคอมพิวเตอร์ ปี 2 · มทร.อีสาน",

  // หนึ่งประโยคว่าคุณสนใจสร้างอะไร เขียนให้เจาะจง อย่าเขียนกว้าง ๆ
  tagline: "สร้าง UI ด้วย State Management และเชื่อมต่อ RESTful API อย่างเป็นระบบ <3",

  // แนะนำตัว 2-3 บรรทัด ว่ามาจากไหน สนใจอะไร กำลังจะไปทางไหน
  about: "กำลังสนุกกับการเรียนรู้และสร้างสรรค์ Web Application ด้วยเทคโนโลยีสมัยใหม่ เน้นการเขียนโค้ดที่สะอาด อ่านง่าย และสร้างประสบการณ์การใช้งานที่ดีเยี่ยม เปิดรับโอกาสใหม่ๆ ในการทำโปรเจกต์และร่วมงานเสมอ 💻⚡️",

  // กำลังเรียนรู้อะไรอยู่ตอนนี้ ใส่ได้ 2-5 รายการ
  learning: [
    "พื้นฐานอินเทอร์เน็ตและบริการออนไลน์",
    "Frontend & Backend Development",
    "การพัฒนา Web Application",
  ],

  // ผลงาน
  works: [],

  // ช่องทางติดต่อ
  links: [
    { label: "GitHub", url: "https://github.com/tanboonla007" },
  ],

  // ธีมสี เลือกหนึ่งอย่าง: "ocean" | "sunset" | "forest" | "grape" | "mono" | "mono-light"
  theme: "mono-light",

};
</script>

<style>
/* ---------- Smooth Scroll ---------- */
html { scroll-behavior: smooth; }

/* ---------- สีพื้นฐาน ทุกธีมใช้ร่วมกัน ---------- */
:root {
  --bg:#0b1020; --line:#24304f; --text:#e8edf7; --muted:#93a1c0;
  --surface:rgba(255,255,255,.05);
  --nav-bg:rgba(11, 16, 32, 0.85);
  --mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --thai: 'Noto Sans Thai', 'Noto Sans', system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ---------- ธีมสี ---------- */
:root,
[data-theme="ocean"]  { --accent:#38bdf8; --accent-soft:#0ea5e9; --glow1:#1d2a52; --glow2:#10305c; --nav-bg:rgba(11, 16, 32, 0.85); }
[data-theme="sunset"] { --accent:#fb923c; --accent-soft:#f97316; --glow1:#4a2418; --glow2:#5c2b10; --nav-bg:rgba(15, 12, 10, 0.85); }
[data-theme="forest"] { --accent:#34d399; --accent-soft:#10b981; --glow1:#14342a; --glow2:#0f3d2e; --nav-bg:rgba(10, 20, 16, 0.85); }
[data-theme="grape"]  { --accent:#c084fc; --accent-soft:#a855f7; --glow1:#2e1d52; --glow2:#3d1a5c; --nav-bg:rgba(20, 12, 32, 0.85); }
[data-theme="mono"]   { --accent:#e2e8f0; --accent-soft:#cbd5e1; --glow1:#1e293b; --glow2:#0f172a; --nav-bg:rgba(15, 23, 42, 0.85); }

[data-theme="mono-light"] {
  --accent:#0891b2; --accent-soft:#0e7490; --glow1:#dbeefb; --glow2:#e7f7f2;
  --bg:#f7fafc; --line:#d7e2ea; --text:#0d1526; --muted:#54607a;
  --surface:rgba(13,21,38,.035);
  --nav-bg:rgba(247, 250, 252, 0.82);
}

*{ box-sizing:border-box }

body{
  margin:0; min-height:100vh; color:var(--text);
  font-family: var(--thai);
  line-height:1.75;
  background: var(--bg);
  position: relative;
  overflow-x: hidden;
}

/* ---------- Ambient background blobs ---------- */
.ambient{
  position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
}
.ambient span{
  position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55;
  animation: drift 22s ease-in-out infinite alternate;
}
.ambient span:nth-child(1){
  width: 460px; height: 460px; background: var(--glow1);
  top: -140px; left: -100px; animation-duration: 26s;
}
.ambient span:nth-child(2){
  width: 380px; height: 380px; background: var(--glow2);
  top: 10%; right: -120px; animation-duration: 30s; animation-delay: -6s;
}
.ambient span:nth-child(3){
  width: 300px; height: 300px; background: var(--accent);
  opacity: .10; bottom: -80px; left: 30%; animation-duration: 34s; animation-delay: -12s;
}
@keyframes drift{
  from{ transform: translate(0,0) scale(1); }
  to{ transform: translate(40px,50px) scale(1.12); }
}

/* ---------- Navbar ---------- */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--nav-bg);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  animation: navSlideDown .7s var(--ease);
}
@keyframes navSlideDown{ from{ transform: translateY(-100%); opacity: 0; } to{ transform: translateY(0); opacity: 1; } }

.nav-container {
  max-width: 760px; margin: 0 auto; padding: 12px 22px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  font-family: var(--mono); font-weight: 700; color: var(--text);
  text-decoration: none; font-size: 15px;
  display: flex; align-items: center; gap: 8px;
  transition: opacity .2s ease;
}
.nav-brand:hover{ opacity: .75; }
.nav-brand .chevron{ color: var(--accent); }

.nav-links { display: flex; gap: 22px; list-style: none; margin: 0; padding: 0; }
.nav-links a {
  position: relative; color: var(--muted); text-decoration: none;
  font-size: 14px; font-weight: 500; padding: 4px 0;
  transition: color .25s ease;
}
.nav-links a::after{
  content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
  background-color: var(--accent); border-radius: 2px;
  transform: scaleX(0); transform-origin: right;
  transition: transform .35s var(--ease);
}
.nav-links a:hover{ color: var(--text); }
.nav-links a:hover::after,
.nav-links a.active::after{ transform: scaleX(1); transform-origin: left; }
.nav-links a.active{ color: var(--text); }

.wrap{ max-width:760px; margin:0 auto; padding:0 22px 80px }

/* ---------- ส่วนหัว ---------- */
.hero{ display:flex; gap:24px; align-items:center; padding:52px 0 8px; flex-wrap:wrap }

.avatar-ring{
  position: relative; width: 100px; height: 100px; flex-shrink: 0;
  opacity: 0; animation: popIn .6s var(--ease) forwards; animation-delay: .05s;
}
.avatar-ring::before{
  content:''; position: absolute; inset: -4px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--accent), transparent 30%, var(--accent) 70%, transparent 100%);
  animation: spin 6s linear infinite; opacity: .55;
}
.avatar, .avatar-fallback{
  position: relative; width:96px; height:96px; border-radius:50%;
  border:2px solid var(--bg-solid, var(--surface)); object-fit:cover;
  background:var(--surface); margin: 2px;
}
.avatar{ display:block; }
.avatar-fallback{
  display:flex; align-items:center; justify-content:center;
  font-size:38px; font-weight:600; color:var(--accent);
  font-family: var(--mono);
}
@keyframes spin{ to{ transform: rotate(360deg); } }
@keyframes popIn{ from{ opacity: 0; transform: scale(.85); } to{ opacity: 1; transform: scale(1); } }

.hero-text{ flex:1; min-width:240px }

.role{
  font:600 12px/1.4 var(--mono); letter-spacing:.02em; color:var(--accent);
  margin:0 0 10px; min-height: 1.4em;
  opacity: 0; animation: fadeUp .5s var(--ease) forwards; animation-delay: .35s;
}
.role .prompt{ color: var(--muted); }
.role .cursor{
  display: inline-block; width: 8px; height: 1em; margin-left: 2px;
  background: var(--accent); vertical-align: -2px;
  animation: blink 1s steps(1) infinite;
}

h1{
  font-size:clamp(30px,6vw,46px); line-height:1.15; margin:0 0 10px; letter-spacing:-.02em;
  opacity: 0; animation: fadeUp .6s var(--ease) forwards; animation-delay: .15s;
}
.tagline{
  font-size:clamp(17px,2.6vw,20px); color:var(--text); margin:0; opacity:.92;
  opacity: 0; animation: fadeUp .6s var(--ease) forwards; animation-delay: .5s;
}
@keyframes fadeUp{ from{ opacity: 0; transform: translateY(10px); } to{ opacity: .92; transform: translateY(0); } }
h1{ animation-name: fadeUpFull; }
@keyframes fadeUpFull{ from{ opacity: 0; transform: translateY(10px); } to{ opacity: 1; transform: translateY(0); } }

@keyframes blink{ 0%,49%{ opacity: 1; } 50%,100%{ opacity: 0; } }

.about{
  color:var(--muted); margin:28px 0 0; max-width:62ch;
  opacity: 0; animation: fadeUpFull .6s var(--ease) forwards; animation-delay: .65s;
}

/* ---------- ปุ่มลิงก์ ---------- */
.links{
  display:flex; flex-wrap:wrap; gap:10px; padding:0; margin:24px 0 0; list-style:none;
  opacity: 0; animation: fadeUpFull .6s var(--ease) forwards; animation-delay: .8s;
}
.links a{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line); border-radius:999px;
  padding:9px 20px; color:var(--text); text-decoration:none; font-size:15px;
  transition: border-color .25s ease, color .25s ease, transform .25s ease, box-shadow .25s ease;
}
.links a:hover, .links a:focus-visible{
  border-color: var(--accent); color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 18px -8px var(--accent);
}

/* ---------- หัวข้อของแต่ละส่วน ---------- */
section{ margin-top:56px; scroll-margin-top: 74px; }
h2{
  font:600 12px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); border-bottom:1px solid var(--line);
  padding-bottom:12px; margin:0 0 22px;
  display: flex; align-items: baseline; gap: 8px;
}
h2::before{ content: '//'; color: var(--accent); opacity: .7; }

/* ---------- รายการกำลังเรียนรู้ ---------- */
.learning{ list-style:none; padding:0; margin:0 }
.learning li{
  border-left:2px solid var(--line); padding:3px 0 3px 16px;
  margin-bottom:14px; color:var(--muted);
  transition: transform .25s var(--ease), color .25s ease, border-color .25s ease;
}
.learning li:hover{ transform: translateX(6px); color: var(--text); border-color: var(--accent); }

/* ---------- ผลงาน ---------- */
.works{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)) }
.work{
  border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  background:var(--surface);
  transition: transform .3s var(--ease), border-color .3s ease, box-shadow .3s ease;
}
.work:hover{ transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 24px -12px var(--accent); }
.work h3{ margin:0 0 6px; font-size:17px }
.work p{ margin:0; color:var(--muted); font-size:14.5px }
.work a{ color:var(--accent); text-decoration:none; font-size:14px; display:inline-block; margin-top:10px }
.work a:hover{ text-decoration:underline }

.empty{
  border:1px dashed var(--line); border-radius:12px; padding:26px 20px;
  color:var(--muted); text-align:center; font-size:14.5px; font-family: var(--mono);
}
.empty .glyph{ color: var(--accent); }

/* ---------- แผงข้อมูลการเชื่อมต่อ ---------- */
.panel{ border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:4px 20px 16px }
.row{
  display:grid; grid-template-columns:minmax(130px,1fr) minmax(0,1.5fr); gap:12px;
  padding:11px 0; border-bottom:1px dashed var(--line); align-items:baseline;
}
.row:last-of-type{ border-bottom:0 }
.row dt{ color:var(--muted); font-size:14px; margin:0 }
.row dd{ margin:0; font-family:var(--mono); font-size:14px; color:var(--accent); word-break:break-all }
.row .note{ display:block; color:var(--muted); font-family: var(--thai); font-size:12.5px }
.hint{ color:var(--muted); font-size:13.5px; margin:14px 0 0; font-family: var(--mono); }

footer{ margin-top:60px; padding-top:22px; border-top:1px solid var(--line); color:var(--muted); font-size:14px }
footer a{ color:var(--accent); text-decoration: none; }
footer a:hover{ text-decoration: underline; }

/* ---------- Scroll Reveal ---------- */
.animate-on-scroll{
  opacity: 0; transform: translateY(24px);
  transition: opacity .6s var(--ease), transform .6s var(--ease);
}
.animate-on-scroll.is-visible{ opacity: 1; transform: translateY(0); }

.stagger > *{
  opacity: 0; transform: translateY(16px);
  transition: opacity .5s var(--ease), transform .5s var(--ease);
}
.stagger.is-visible > *{ opacity: 1; transform: translateY(0); }
.stagger.is-visible > *:nth-child(1){ transition-delay: .03s; }
.stagger.is-visible > *:nth-child(2){ transition-delay: .09s; }
.stagger.is-visible > *:nth-child(3){ transition-delay: .15s; }
.stagger.is-visible > *:nth-child(4){ transition-delay: .21s; }
.stagger.is-visible > *:nth-child(5){ transition-delay: .27s; }
.stagger.is-visible > *:nth-child(6){ transition-delay: .33s; }
.stagger.is-visible > *:nth-child(n+7){ transition-delay: .38s; }

/* ---------- จอมือถือ ---------- */
@media (max-width:520px){
  .nav-container{ padding: 10px 16px; }
  .nav-links{ gap: 12px; font-size: 13px; }
  .hero{ padding-top:36px; gap:16px }
  .avatar-ring{ width:76px; height:76px; }
  .avatar, .avatar-fallback{ width:72px; height:72px; font-size:28px }
  .row{ grid-template-columns:1fr; gap:2px }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
  *, *::before, *::after{ animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  .ambient span{ animation: none; }
  .avatar-ring::before{ animation: none; }
  .role .cursor{ animation: none; opacity: 1; }
}

/* ---------- Focus visibility ---------- */
a:focus-visible, button:focus-visible{
  outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px;
}
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>

<nav class="navbar">
  <div class="nav-container">
    <a href="#top" class="nav-brand" id="navBrand"><span class="chevron">❯</span><span id="navBrandText">Portfolio</span></a>
    <ul class="nav-links">
      <li><a href="#learning-section" data-section="learning-section">กำลังเรียนรู้</a></li>
      <li><a href="#works-section" data-section="works-section">ผลงาน</a></li>
      <li><a href="#network-section" data-section="network-section">ข้อมูลการเชื่อมต่อ</a></li>
    </ul>
  </div>
</nav>

<div class="wrap" id="top">

  <header class="hero">
    <div class="avatar-ring">
      <img class="avatar" id="avatar" alt="" width="96" height="96">
    </div>
    <div class="hero-text">
      <p class="role" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>
  <p class="about" id="about"></p>
  <ul class="links" id="links"></ul>

  <section id="learning-section" class="animate-on-scroll">
    <h2>กำลังเรียนรู้</h2>
    <ul class="learning stagger" id="learning"></ul>
  </section>

  <section id="works-section" class="animate-on-scroll">
    <h2>ผลงาน</h2>
    <div class="works stagger" id="works"></div>
  </section>

  <section id="network-section" class="animate-on-scroll">
    <h2>ข้อมูลการเชื่อมต่อของหน้านี้</h2>
    <div class="panel">
      <dl id="netpanel" class="stagger"></dl>
      <p class="hint">กด F12 เลือกแท็บ Network แล้วกด Ctrl+F5 เพื่อเปรียบเทียบค่า</p>
    </div>
  </section>

  <footer>
    สร้างด้วย HTML, CSS และ JavaScript · โฮสต์บน GitHub Pages ·
    <a id="repolink" href="https://github.com">ดูซอร์สโค้ดของหน้านี้</a>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 1) นำข้อมูลจากกล่อง ME มาแสดง ---------- */
document.title = ME.name;
document.documentElement.dataset.theme = ME.theme || 'ocean';

$('name').textContent      = ME.name;
$('about').textContent     = ME.about;
$('navBrandText').textContent = ME.name;

/* Role: terminal-style prompt with typewriter effect */
const roleEl = $('role');
const promptSpan = document.createElement('span');
promptSpan.className = 'prompt';
promptSpan.textContent = '$ whoami » ';
const roleText = document.createElement('span');
const cursor = document.createElement('span');
cursor.className = 'cursor';
roleEl.append(promptSpan, roleText, cursor);

if (reduceMotion) {
  roleText.textContent = ME.role;
} else {
  let i = 0;
  const full = ME.role || '';
  function typeRole(){
    if (i <= full.length) {
      roleText.textContent = full.slice(0, i);
      i++;
      setTimeout(typeRole, 28);
    }
  }
  setTimeout(typeRole, 550); // start after the role label fades in
}

$('tagline').textContent = ME.tagline;

const avatar = $('avatar');
avatar.alt = 'รูปโปรไฟล์ของ ' + ME.name;
avatar.addEventListener('error', () => {
  const box = document.createElement('div');
  box.className = 'avatar-fallback';
  box.setAttribute('aria-hidden', 'true');
  box.textContent = (ME.name || '?').trim().charAt(0);
  avatar.replaceWith(box);
});
avatar.src = 'https://github.com/' + ME.github + '.png?size=192';

for (const item of ME.learning || []) {
  const li = document.createElement('li');
  li.textContent = item;
  $('learning').appendChild(li);
}

for (const link of ME.links || []) {
  const a = document.createElement('a');
  a.href = link.url;
  a.textContent = link.label;
  a.rel = 'noopener noreferrer';
  const li = document.createElement('li');
  li.appendChild(a);
  $('links').appendChild(li);
}

if (!ME.works || ME.works.length === 0) {
  const box = document.createElement('div');
  box.className = 'empty';
  box.innerHTML = '<span class="glyph">//</span> ยังไม่มีผลงานในหน้านี้ กำลังเรียนรู้อยู่ แล้วจะกลับมาเพิ่มเรื่อย ๆ';
  $('works').appendChild(box);
} else {
  for (const w of ME.works) {
    const card = document.createElement('div');
    card.className = 'work';
    const h3 = document.createElement('h3');
    h3.textContent = w.title;
    const p = document.createElement('p');
    p.textContent = w.desc;
    card.append(h3, p);
    if (w.url) {
      const a = document.createElement('a');
      a.href = w.url;
      a.textContent = 'ดูผลงาน ↗';
      a.rel = 'noopener noreferrer';
      card.appendChild(a);
    }
    $('works').appendChild(card);
  }
}

$('repolink').href = 'https://github.com/' + ME.github + '/' + ME.github + '.github.io';

/* ---------- 2) แผงข้อมูลการเชื่อมต่อ อ่านค่าจริงจาก Performance API ---------- */
function ms(v) {
  if (typeof v !== 'number' || v < 0 || Number.isNaN(v)) return '—';
  return Math.round(v) + ' ms';
}

window.addEventListener('load', () => setTimeout(() => {
  const nav = performance.getEntriesByType('navigation')[0];
  const rows = [
    ['Domain name', location.hostname || '(เปิดจากไฟล์ในเครื่อง)',
     'ชื่อโดเมนต้องถูกแปลงเป็น IP address ผ่าน DNS ก่อน จึงจะติดต่อ server ได้'],
    ['Protocol', location.protocol,
     'https คือ HTTP ที่เพิ่มการเข้ารหัสและการยืนยันตัวตน server ด้วย certificate'],
  ];
  if (nav) rows.push(
    ['HTTP version', nav.nextHopProtocol || '—',
     'h2 คือ HTTP/2 และ h3 คือ HTTP/3 ซึ่งส่งหลายไฟล์พร้อมกันได้ในการเชื่อมต่อเดียว'],
    ['DNS lookup', ms(nav.domainLookupEnd - nav.domainLookupStart),
     'เวลาที่ใช้แปลงชื่อโดเมนเป็น IP address ถ้าได้ 0 ms แปลว่ามีคำตอบอยู่ใน cache แล้ว'],
    ['Connection + TLS', ms(nav.connectEnd - nav.connectStart),
     'เวลาสร้างการเชื่อมต่อ รวมขั้นตอน TLS handshake ก่อนเริ่มรับส่งข้อมูลจริง'],
    ['TTFB', ms(nav.responseStart - nav.requestStart),
     'Time To First Byte เวลาตั้งแต่ส่ง request จนได้ข้อมูลไบต์แรกกลับมา ยิ่ง server ไกลยิ่งสูง'],
  );

  for (const [label, value, note] of rows) {
    const row = document.createElement('div');
    row.className = 'row';
    const dt = document.createElement('dt');
    dt.textContent = label;
    const dd = document.createElement('dd');
    dd.textContent = value;
    const small = document.createElement('span');
    small.className = 'note';
    small.textContent = note;
    dd.appendChild(small);
    row.append(dt, dd);
    $('netpanel').appendChild(row);
  }
}, 0));

/* ---------- 3) ควบคุม Smooth Scroll เมื่อกดเมนู Navbar ---------- */
document.querySelectorAll('.nav-links a').forEach(anchor => {
  anchor.addEventListener('click', function (e) {
    e.preventDefault();
    const targetId = this.getAttribute('href');
    const targetElement = document.querySelector(targetId);
    if (targetElement) {
      const navHeight = document.querySelector('.navbar').offsetHeight;
      const elementPosition = targetElement.getBoundingClientRect().top;
      const offsetPosition = elementPosition + window.pageYOffset - navHeight - 16;
      window.scrollTo({ top: offsetPosition, behavior: reduceMotion ? 'auto' : 'smooth' });
    }
  });
});

/* ---------- 4) Scroll Reveal Animation ---------- */
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('is-visible');
  });
}, { root: null, rootMargin: '0px', threshold: 0.12 });

document.querySelectorAll('.animate-on-scroll').forEach(el => revealObserver.observe(el));

/* ---------- 5) Active nav link ตามตำแหน่งที่กำลังอ่าน ---------- */
const navLinks = document.querySelectorAll('.nav-links a');
const sectionObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const link = document.querySelector('.nav-links a[data-section="' + entry.target.id + '"]');
    if (!link) return;
    if (entry.isIntersecting) {
      navLinks.forEach(l => l.classList.remove('active'));
      link.classList.add('active');
    }
  });
}, { root: null, rootMargin: '-45% 0px -50% 0px', threshold: 0 });

document.querySelectorAll('section[id]').forEach(sec => sectionObserver.observe(sec));
</script>
</body>
</html>
